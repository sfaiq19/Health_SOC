[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-soc-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["Flask>=3.1,<3.2", "requests>=2.32,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
hospital-soc = "hospital_soc.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
